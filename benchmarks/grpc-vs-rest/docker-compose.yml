services:
  server:
    build: .
    image: grpc-vs-rest-bench:latest
    command: ["/usr/local/bin/server"]
    ports:
      - "50051:50051"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/users/1"]
      interval: 2s
      timeout: 2s
      retries: 30

  client:
    image: grpc-vs-rest-bench:latest
    entrypoint: ["/usr/local/bin/client"]
    depends_on:
      server:
        condition: service_healthy
