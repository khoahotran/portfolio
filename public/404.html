<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <!--
      SUPERSEDED IN A FULL BUILD. scripts/prerender.mjs overwrites dist/404.html with a real,
      prerendered "Page not found" page, because every route that actually exists now ships as
      its own HTML file (see that script's header) — so an unknown path is a genuine 404 and
      should look like one, not bounce through the SPA.

      This file survives as the fallback for a bare `vite build` with no prerender pass: GitHub
      Pages serves it for any path it doesn't recognise as a static asset, and it re-encodes the
      requested path into a query string on the site root, which the inline script in index.html
      decodes via history.replaceState before React Router mounts. That inline script is kept for
      the same reason, plus backwards compatibility with any `?redirect=` links already shared
      from the previous deployment.
      Standard pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var base = '/portfolio/';
      var path = location.pathname.slice(base.length);
      var redirect = base + '?redirect=' + encodeURIComponent(path + location.search + location.hash);
      location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
