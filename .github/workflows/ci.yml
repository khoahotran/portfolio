name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # Pure-logic unit tests: lab registry / lab-ids.json parity, slugify parity between the app
      # and the build script, and the frontmatter + reading-time helpers. Runs before the build
      # because a slugify divergence would otherwise produce a green build full of unreachable
      # articles. See src/content-engine/slugify.test.ts for why that one matters most.
      - run: npm test

      # Chromium only — neither the prerender pass nor the regression check needs
      # Firefox/WebKit. Resolved from the `playwright` devDependency already in
      # package.json, not installed ad hoc. Must come BEFORE the build: `npm run build`
      # now ends with `npm run prerender`, which drives headless Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # build:search-index -> vite build -> prerender (see package.json). The prerender
      # step fails the build if any route ships without its own title/canonical/og:image,
      # which is the regression it exists to prevent.
      - run: npm run build

      - name: Start preview server
        run: npx vite preview --port 4173 --strictPort &

      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/portfolio/ > /dev/null && exit 0
            sleep 1
          done
          echo "Preview server did not become ready in time" >&2
          exit 1

      # Routes x viewports horizontal-overflow + console/page-error check.
      # See scripts/check-responsive.mjs and .ai/audit-followups.md item 5 —
      # this is what protects the `min-w-0` convention from silently
      # regressing as new components are added.
      - name: Responsive regression check
        run: npm run check:responsive

      # WCAG AA contrast across every route in BOTH themes. This is what makes the dark theme
      # verifiable rather than asserted, and it closes .ai/audit-followups.md item 2 with a
      # measurement instead of an opinion — the whole point of that item was that nobody had
      # measured which `text-slate-400` uses actually failed.
      - name: Contrast check
        run: npm run check:contrast
