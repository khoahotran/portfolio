<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Kept in sync with PortfolioHome.tsx's useSeo() call - this is the
         literal first-paint value for any client that renders HTML before
         (or without) executing JS, so it should read the same as the
         hydrated homepage, not a separately-worded fallback. -->
    <title>Trần Nguyễn Anh Khoa - Software Engineer | Khoa Tran Engineering Portfolio</title>
    <meta
      name="description"
      content="Backend systems developer portfolio, featuring architecture case studies, event-driven banking systems, and technical experiments."
    />
    <meta
      name="keywords"
      content="Software Developer, Backend Engineer, NestJS, Firebase, Full-stack, Vietnam, Portfolio"
    />
    <meta
      property="og:title"
      content="Trần Nguyễn Anh Khoa - Software Engineer | Khoa Tran Engineering Portfolio"
    />
    <meta
      property="og:description"
      content="Backend systems developer portfolio, featuring architecture case studies, event-driven banking systems, and technical experiments."
    />
    <meta property="og:image" content="https://khoahotran.github.io/portfolio/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://khoahotran.github.io/portfolio/og-default.png" />
    <!--
      Theme bootstrap. Must be inline and in <head>: it has to set the class before the first
      paint, or a dark-mode visitor sees a white flash on every navigation. Kept as duplicated
      logic rather than an import because any module would load too late to prevent that - the
      canonical version is src/theme/theme.ts, and the two must stay in agreement.

      Prerendered pages (scripts/prerender.mjs) are serialized with the build machine's theme
      forced to light, so this script is what corrects the class per visitor.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* Storage blocked - fall back to the light default rather than failing to render. */
        }

        /* Boot curtain (src/boot-reveal.ts). Hides #root so the prerendered page is never painted
           and then deleted by React's createRoot, which would show real content and take it away
           again behind a Suspense spinner. Added from script, not from the stylesheet, so that a
           crawler that does not execute JS - or a reader whose JS failed - still gets the fully
           rendered markup. Skipped during prerendering (scripts/prerender.mjs sets the flag), or
           the class would be serialized into the output and ship content that is display:none. */
        if (!window.__PRERENDER__) {
          document.documentElement.classList.add('js-booting');

          var lift = function () {
            document.documentElement.classList.remove('js-booting');
          };

          /* A crash between here and React's first commit must not leave a blank page forever, so
             the curtain needs a way up that does not depend on React. Keyed on real failure, not
             on a stopwatch: a stopwatch cannot tell "dead" from "slow", and firing it mid-boot on
             a slow connection reintroduces exactly the flash the curtain exists to prevent - a
             4s timer did, on throttled mobile where booting can take longer than that.

             Capture phase, because resource errors do not bubble. Only a failed <script> counts:
             an image or stylesheet that 404s does not stop React from mounting, and lifting on
             one would put the flash back for a page with a single broken image. A runtime error
             (target is window, not an element) does count. unhandledrejection covers a dynamic
             import that fails to resolve. */
          window.addEventListener(
            'error',
            function (event) {
              var target = event.target;
              var isResource = target && target !== window && target.tagName;
              if (!isResource || target.tagName === 'SCRIPT') lift();
            },
            true
          );
          window.addEventListener('unhandledrejection', lift);

          /* Last resort, for a failure that signals nothing at all. Deliberately long: every
             failure worth catching fires one of the listeners above within milliseconds, so this
             only has to beat "blank forever", not "blank for a while". */
          setTimeout(lift, 15000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Companion to public/404.html: restores the real path (encoded as
      ?redirect=) via history.replaceState before React Router mounts, so a
      hard refresh or shared link on GitHub Pages lands on the right route
      instead of the home page.
    -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get('redirect');
        if (redirect) {
          var base = '%BASE_URL%';
          history.replaceState(null, '', base + redirect);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
