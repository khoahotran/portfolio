[databases]
benchmark = host=postgres port=5432 dbname=benchmark
; alias so the Docker healthcheck's pg_isready probe (which defaults to dbname=postgres) gets a
; clean accept/reject instead of a "no such database" log line on every single health check tick
postgres = host=postgres port=5432 dbname=benchmark

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 300
default_pool_size = 20
admin_users = postgres
; lib/pq (the Go client this harness uses) always sends `extra_float_digits` as a startup
; parameter; pgbouncer only forwards a fixed whitelist of startup parameters to the server and
; rejects anything outside it by default, which crashed every pgbouncer-target run with
; "unsupported startup parameter: extra_float_digits" until this was added. Found by actually
; running the harness against pgbouncer, not inferred from documentation.
ignore_startup_parameters = extra_float_digits
